
name: 'PriceScrapper'
on: 
  workflow_dispatch:
  repository_dispatch: 
    types: start-manually
  push:
  schedule:
    - cron: '30 5 * * 1/2'
env: 
  WOOCOMERCE_KEY: ${{ secrets.WOOCOMERCE_KEY }}
  WOOCOMERCE_SECRET: ${{ secrets.WOOCOMERCE_SECRET }}
  WOOCOMERCE_HOST: ${{ secrets.WOOCOMERCE_HOST }}
  USER: ${{ secrets.USER }}
  PASS: ${{ secrets.PASS }}
  SECRET: ${{ secrets.secret }}
  FTP_PASS: ${{ secrets.FTP_PASS }}
  FTP_USER: ${{ secrets.FTP_USER }}
jobs:
  main:
    runs-on: ubuntu-latest
    name: main
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      name: price_crapper
      with:
        python-version: '3.13' 
        cache: 'pip'
    - run: pip install -r requirements.txt
    - run : python main.py

    - name: Commit and push
      run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-commit: workflow completed"
          git push
